services:
  osdsarvaya:
    # Pre-built image from GitHub Container Registry — `docker compose up -d`
    # pulls and never builds locally. For local builds see docker-compose.build.yml.
    image: ghcr.io/devosduotech/osdsarvaya:${APP_VERSION:-2.0.2}
    # Always check the registry so a pinned tag picks up a re-published digest,
    # and `APP_VERSION=latest` gets fresh images on every `up`.
    pull_policy: always
    container_name: osdsarvaya-app
    ports:
      - "3001:3001"

    env_file:
      - production.env

    environment:
      - APP_VERSION=${APP_VERSION:-2.0.2}
      - TZ=Asia/Kolkata

    # The host runs systemd-resolved on 127.0.0.53, which intermittently
    # times out for WhatsApp domains inside containers. Use public resolvers
    # directly so WhatsApp Web can reach its servers.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    volumes:
      # The database and the WhatsApp session both live under server/data
      # (see getDataPath()/getSessionPath() in whatsappClient.js).
      - ./osdsarvaya_data:/app/server/data

    restart: unless-stopped
    shm_size: "1gb"

    stop_grace_period: 40s   # ✅ Critical for Chromium cleanup

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    deploy:
      resources:
        limits:
          # Chromium + Node commonly peak above 1 GB while WhatsApp Web loads.
          memory: 2g
